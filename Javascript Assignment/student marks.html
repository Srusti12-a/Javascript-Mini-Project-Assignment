
<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
</head>
<body>
    <h2>Student Grade Calculator</h2>

    <div id="output"></div>

    <script>
        // Get the test score from the user
        let score = Number(prompt("Enter your test score:"));

        // Determine the grade using if...else
        let grade;

        if (score >= 90) {
            grade = "A";
        } else if (score >= 80) {
            grade = "B";
        } else if (score >= 70) {
            grade = "C";
        } else if (score >= 60) {
            grade = "D";
        } else {
            grade = "F";
        }

        // Determine the letter grade using switch
        switch (grade) {
            case "A":
                grade = "A";
                break;
            case "B":
                grade = "B";
                break;
            case "C":
                grade = "C";
                break;
            case "D":
                grade = "D";
                break;
            default:
                grade = "F";
        }

        // Determine pass or fail using ternary operator
        let status = score >= 40 ? "Passed" : "Failed";

        // Display output in the browser
        document.getElementById("output").innerHTML =
            "Score: " + score + "<br>" +
            "Grade: " + grade + "<br>" +
            "Status: " + status;

        // Display output in the console
        console.log("Score: " + score);
        console.log("Grade: " + grade);
        console.log("Status: " + status);
    </script>
</body>
</html>
